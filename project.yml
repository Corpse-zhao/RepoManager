name: RepoManager
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.repomanager
    MARKETING_VERSION: 1.1.7
    CURRENT_PROJECT_VERSION: 18
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  RepoManager:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    resources:
      - path: Assets/Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 源管理
        CFBundleName: RepoManager
        CFBundleIdentifier: com.corpsezhao.repomanager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 用于扫描二维码导入仓库配置
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Debian Package"
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.corpsezhao.repomanager.deb
          - CFBundleTypeName: "iOS App Package"
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.corpsezhao.repomanager.ipa
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.corpsezhao.repomanager.deb
            UTTypeDescription: Debian Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - deb
          - UTTypeIdentifier: com.corpsezhao.repomanager.ipa
            UTTypeDescription: iOS App Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
